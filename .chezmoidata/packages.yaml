# Packages installed by run_onchange_before_10-install-packages.sh.tmpl.
# Editing this list changes the rendered script, so the next `chezmoi apply`
# installs whatever was added. Removing a package here does not uninstall it.
#
# Language toolchains (node, go, ...) live in ~/.config/mise/config.toml instead.
# `aur:` packages go through omarchy-pkg-aur-add (yay) after the pacman ones.
packages:
  pacman:
    # Neovim and its build needs (treesitter compiles parsers)
    - neovim
    - base-devel
    - tree-sitter-cli
    # LazyVim only maps <leader>gg / <leader>gG when lazygit is on PATH
    - lazygit
    # lua/plugins/lazydocker.lua
    - lazydocker
    # fzf-lua / snacks pickers
    - ripgrep
    - fd
    - fzf
    # fzf-lua code-action previewer uses delta when present
    - git-delta
    # stylua.toml in the nvim config
    - stylua
    # snacks.image rendering
    - imagemagick
    - python-pip
    # modify_ script for ~/.config/vesktop/settings/settings.json
    - jq
  aur:
    # Discord client; Vencord's CustomIdle keeps presence Online (docs/desktop.md).
    # Started minimized by hypr/autostart.lua; settings via modify_settings.json.
    - vesktop-bin
    # Monitor layout TUI (github.com/erans/hyprmon); prebuilt for x86_64 + aarch64.
    # Writes ~/.config/hypr/hyprmon.lua; see docs/desktop.md#monitors.
    - hyprmon-bin
    # Mullvad VPN app + daemon (pulls mullvad-vpn-daemon-bin; its install script
    # enables mullvad-daemon). Account login is manual, never in this repo.
    - mullvad-vpn-bin
    ## Development tools
    - postman-bin
